<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventPhotoBot — one photo, end to end</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f6f3;
      --color-ink:     #272727;
      --color-muted:   #49706d;
      --color-accent:  #bd8167;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · EventPhotoBot</p>
    <h1>One photo, end to end</h1>

    <svg viewBox="0 0 1040 820" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="epb-seq-title epb-seq-desc">
      <title id="epb-seq-title">EventPhotoBot — one photo, end to end</title>
      <desc id="epb-seq-desc">Time-ordered exchange between a sender's phone, the Telegram Bot API, the bot service, the display and the event bucket: the bot fetches the file it was told about, decodes and hashes it, writes its objects before writing state, acknowledges the sender, and then serves a repeating manifest poll from memory — returning a fresh playlist only when the generation counter has moved.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#49706d"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bd8167"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#004d48"/></marker>
        <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#49706d" stroke-width="1.2"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f6f3"/>

      <!-- ===== lifelines ===== -->
      <line x1="120" y1="120" x2="120" y2="728" stroke="rgba(39,39,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="320" y1="120" x2="320" y2="728" stroke="rgba(39,39,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="520" y1="120" x2="520" y2="728" stroke="rgba(39,39,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="720" y1="120" x2="720" y2="728" stroke="rgba(39,39,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="920" y1="120" x2="920" y2="728" stroke="rgba(39,39,39,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== loop fragment (behind messages) ===== -->
      <rect x="508" y="504" width="224" height="124" rx="4" fill="rgba(39,39,39,0.02)" stroke="rgba(39,39,39,0.22)" stroke-width="1"/>
      <rect x="508" y="504" width="44" height="16" rx="2" fill="#f7f6f3" stroke="rgba(39,39,39,0.22)" stroke-width="1"/>
      <text x="530" y="516" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
      <text x="520" y="540" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[every 2 s]</text>

      <!-- ===== activation bars ===== -->
      <rect x="316" y="152" width="8" height="132" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="316" y="468" width="8" height="20" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="516" y="192" width="8" height="292" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="516" y="568" width="8" height="44" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="516" y="656" width="8" height="60" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="716" y="568" width="8" height="44" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="716" y="656" width="8" height="44" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="916" y="388" width="8" height="16" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="916" y="428" width="8" height="16" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>
      <rect x="916" y="704" width="8" height="16" fill="rgba(39,39,39,0.06)" stroke="#49706d" stroke-width="0.8"/>

      <!-- ===== messages ===== -->

      <!-- m1 phone -> telegram -->
      <line x1="120" y1="152" x2="316" y2="152" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="182" y="132" width="76" height="12" rx="2" fill="#f7f6f3"/>
      <text x="220" y="141" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">sendPhoto</text>

      <!-- m2 telegram -> bot -->
      <line x1="324" y1="192" x2="516" y2="192" stroke="#004d48" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="374" y="172" width="92" height="12" rx="2" fill="#f7f6f3"/>
      <text x="420" y="181" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /tg/{secret}</text>

      <!-- m3 bot -> telegram -->
      <line x1="516" y1="232" x2="324" y2="232" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="372" y="212" width="96" height="12" rx="2" fill="#f7f6f3"/>
      <text x="420" y="221" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">getFile + download</text>

      <!-- m4 telegram -> bot (return) -->
      <line x1="324" y1="272" x2="516" y2="272" stroke="#49706d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="390" y="252" width="60" height="12" rx="2" fill="#f7f6f3"/>
      <text x="420" y="261" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">file bytes</text>

      <!-- m5 bot self -->
      <path d="M 524,312 H 556 Q 564,312 564,320 V 340 Q 564,348 556,348 H 528" fill="none" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="574" y="324" width="112" height="12" rx="2" fill="#f7f6f3"/>
      <text x="574" y="333" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">decode · exif · sha256</text>

      <!-- m6 bot -> bucket -->
      <line x1="524" y1="388" x2="916" y2="388" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="785" y="368" width="70" height="12" rx="2" fill="#f7f6f3"/>
      <text x="820" y="377" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUT objects ×3</text>

      <!-- m7 bot -> bucket -->
      <line x1="524" y1="428" x2="916" y2="428" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="786" y="408" width="68" height="12" rx="2" fill="#f7f6f3"/>
      <text x="820" y="417" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUT state.json</text>

      <!-- m8 bot -> telegram (async ack) -->
      <line x1="516" y1="468" x2="324" y2="468" stroke="#49706d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <rect x="374" y="448" width="92" height="12" rx="2" fill="#f7f6f3"/>
      <text x="420" y="457" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">sendMessage: got it</text>

      <!-- m9 screen -> bot (inside loop) -->
      <line x1="716" y1="568" x2="524" y2="568" stroke="#004d48" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="574" y="548" width="92" height="12" rx="2" fill="#f7f6f3"/>
      <text x="620" y="557" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /api/manifest</text>

      <!-- m10 bot -> screen (headline return) -->
      <line x1="524" y1="604" x2="716" y2="604" stroke="#bd8167" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <rect x="565" y="584" width="110" height="12" rx="2" fill="#f7f6f3"/>
      <text x="620" y="593" fill="#bd8167" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">304, or 200 + etag</text>

      <!-- m11 screen -> bot -->
      <line x1="716" y1="656" x2="524" y2="656" stroke="#004d48" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="565" y="636" width="110" height="12" rx="2" fill="#f7f6f3"/>
      <text x="620" y="645" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET /img/{id}/display</text>

      <!-- m12 bot -> bucket -->
      <line x1="524" y1="704" x2="916" y2="704" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="777" y="684" width="86" height="12" rx="2" fill="#f7f6f3"/>
      <text x="820" y="693" fill="#769391" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">read display.jpg</text>

      <!-- ===== actors ===== -->

      <rect x="48" y="64" width="144" height="56" rx="6" fill="#f7f6f3"/>
      <rect x="48" y="64" width="144" height="56" rx="6" fill="rgba(73,112,109,0.10)" stroke="#769391" stroke-width="1"/>
      <text x="120" y="92" fill="#272727" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sender's phone</text>
      <text x="120" y="108" fill="#49706d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">whitelisted</text>

      <rect x="248" y="64" width="144" height="56" rx="6" fill="#f7f6f3"/>
      <rect x="248" y="64" width="144" height="56" rx="6" fill="rgba(39,39,39,0.03)" stroke="rgba(39,39,39,0.30)" stroke-width="1"/>
      <text x="320" y="92" fill="#272727" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Telegram Bot API</text>
      <text x="320" y="108" fill="#49706d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20 MB cap</text>

      <rect x="448" y="64" width="144" height="56" rx="6" fill="#f7f6f3"/>
      <rect x="448" y="64" width="144" height="56" rx="6" fill="rgba(189,129,103,0.08)" stroke="#bd8167" stroke-width="1"/>
      <text x="520" y="92" fill="#272727" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bot service</text>
      <text x="520" y="108" fill="#49706d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one instance</text>

      <rect x="648" y="64" width="144" height="56" rx="6" fill="#f7f6f3"/>
      <rect x="648" y="64" width="144" height="56" rx="6" fill="rgba(73,112,109,0.10)" stroke="#769391" stroke-width="1"/>
      <text x="720" y="92" fill="#272727" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Display /show</text>
      <text x="720" y="108" fill="#49706d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one browser tab</text>

      <rect x="848" y="64" width="144" height="56" rx="6" fill="#f7f6f3"/>
      <rect x="848" y="64" width="144" height="56" rx="6" fill="rgba(39,39,39,0.05)" stroke="#49706d" stroke-width="1"/>
      <text x="920" y="92" fill="#272727" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Event bucket</text>
      <text x="920" y="108" fill="#49706d" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gcs</text>

      <!-- ===== legend ===== -->
      <line x1="48" y1="764" x2="992" y2="764" stroke="rgba(39,39,39,0.12)" stroke-width="0.8"/>
      <text x="48" y="788" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="150" y1="784" x2="182" y2="784" stroke="#49706d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="192" y="788" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">CALL</text>

      <line x1="300" y1="784" x2="332" y2="784" stroke="#49706d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="342" y="788" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

      <line x1="470" y1="784" x2="502" y2="784" stroke="#49706d" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-open)"/>
      <text x="512" y="788" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FIRE AND FORGET</text>

      <line x1="700" y1="784" x2="732" y2="784" stroke="#bd8167" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="742" y="788" fill="#49706d" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PLAYLIST CHANGED</text>
    </svg>
  </div>
</body>
</html>
