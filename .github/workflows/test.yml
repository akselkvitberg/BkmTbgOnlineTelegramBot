name: Test

# Builds and runs the test suite on every pull request, and on pushes to
# master so the branch's own status stays visible. Needs no GCP access and
# no repository variables: the tests run against in-memory fakes for the
# bucket and Telegram.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test EventPhotoBot.slnx --configuration Release
