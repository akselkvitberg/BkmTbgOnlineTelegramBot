<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kø</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <nav>
    <a href="/admin/queue">Kø<span class="badge"></span></a>
    <a href="/admin/images">Bilder</a>
    <a href="/upload">Last opp</a>
    <a href="/admin/telegram">Telegram</a>
    <a href="/admin/events">Arrangementer</a>
    <a href="/admin/settings">Innstillinger</a>
    <a href="/show">Skjerm</a>
    <form method="post" action="/logout" class="nav-logout"><button type="submit">Logg ut</button></form>
  </nav>

  <main>
    <div id="pairing-banner" hidden>
      <strong>Paringsmodus er på</strong>
      <span class="muted">Alle som sender melding til boten nå, blir registrert som avsender.</span>
    </div>
    <div id="takeover-banner" hidden></div>

    <header class="page-head">
      <h1>Til godkjenning</h1>
      <span class="muted" id="queue-count"></span>
    </header>

    <select id="event-filter" aria-label="Arrangement" hidden></select>

    <div id="queue"></div>
  </main>

  <script src="/admin/admin.js"></script>
  <script>
    // The manifest carries only approved images, so the queue needs the pending
    // ones separately. /api/manifest reports the count; this page lists them.
    let pending = [];

    // The photo being reviewed. Oldest first by default, so nobody's photo waits
    // behind a stream of newer ones; picking a thumbnail from "Neste" jumps to it.
    let currentId = null;

    let events = [];
    let filter = '';   // '' = every open event

    const current = () => pending.find(image => image.id === currentId) ?? pending[0];

    async function loadPending() {
      events = await Admin.events(true);
      const open = new Set(events.filter(e => e.phase === 'open').map(e => e.id));
      const response = await fetch('/api/images?status=pending', { cache: 'no-store' });
      if (!response.ok) return;
      // The API lists newest first.
      pending = (await response.json())
        .filter(image => open.has(image.eventId) && (!filter || image.eventId === filter))
        .reverse();
      renderFilter(open);
      render();
    }

    const eventName = id => events.find(e => e.id === id)?.name ?? id;

    function renderFilter(open) {
      const host = document.getElementById('event-filter');
      host.hidden = open.size < 2;
      host.innerHTML = `<option value="">Alle åpne arrangementer</option>` +
        events.filter(e => open.has(e.id))
          .map(e => `<option value="${Admin.escapeHtml(e.id)}" ${e.id === filter ? 'selected' : ''}>${Admin.escapeHtml(e.name)}</option>`)
          .join('');
      host.onchange = () => { filter = host.value; currentId = null; loadPending(); };
    }

    function render() {
      const container = document.getElementById('queue');
      const count = document.getElementById('queue-count');
      count.textContent = pending.length === 0 ? ''
        : `${pending.length} ${pending.length === 1 ? 'bilde venter' : 'bilder venter'}`;

      if (pending.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <strong>Ingenting venter</strong>
            Nye bilder dukker opp her av seg selv.
          </div>`;
        return;
      }

      const image = current();
      currentId = image.id;
      const rest = pending.filter(other => other.id !== image.id);
      const sender = Admin.escapeHtml(image.senderName ?? 'Ukjent');

      // Only ids - server-generated ULIDs and numeric sender ids - go into
      // attributes; names and captions are attacker-controlled and are escaped
      // into text.
      container.innerHTML = `
        <section class="review" aria-label="Bildet som vurderes">
          <div class="review-photo">
            <img src="${Admin.imageUrl(image.id, 'display')}" alt="Bilde fra ${sender}">
          </div>
          <div class="review-side">
            <span class="review-sender">${sender}</span>
            <span class="event-label">${Admin.escapeHtml(eventName(image.eventId))}</span>
            <span class="muted">Sendt ${Admin.timeAgo(image.receivedAt)}</span>
            ${image.caption ? `<p class="review-caption">${Admin.escapeHtml(image.caption)}</p>` : ''}
            <p class="muted shortcut-hint"><kbd>Enter</kbd> godkjenn · <kbd>Esc</kbd> avvis</p>
            <div class="review-actions">
              <button class="danger" data-decide="rejected">Avvis</button>
              <button class="primary" data-decide="approved">Godkjenn</button>
              ${image.senderId
                ? `<button class="quiet-danger" data-ban="${image.senderId}">Utesteng ${sender}…</button>`
                : ''}
            </div>
          </div>
        </section>
        ${rest.length ? `
          <section class="up-next">
            <h2>Neste (${rest.length})</h2>
            <ol>
              ${rest.map(other => `
                <li><button data-pick="${other.id}"
                            aria-label="Vis bildet fra ${Admin.escapeHtml(other.senderName ?? 'Ukjent')}">
                  <img src="${Admin.imageUrl(other.id, 'thumb')}" alt="" loading="lazy">
                </button></li>`).join('')}
            </ol>
          </section>` : ''}`;

      for (const button of container.querySelectorAll('[data-decide]'))
        button.onclick = () => decide(image.id, button.dataset.decide);
      for (const button of container.querySelectorAll('[data-pick]'))
        button.onclick = () => { currentId = button.dataset.pick; render(); };
      const ban = container.querySelector('[data-ban]');
      if (ban) ban.onclick = () => banSender(Number(ban.dataset.ban), image.senderName ?? 'denne avsenderen');
    }

    // Noticing a bad sender happens while looking at their photo, not while reading
    // the settings page.
    async function banSender(senderId, name) {
      const sure = await Admin.confirm({
        title: `Utestenge ${name}?`,
        body: 'Alt vedkommende allerede har sendt blir avvist, også bilder som vises på '
            + 'skjermen nå. Nye bilder fra dem blir ignorert. Dette kan ikke angres.',
        confirmLabel: 'Utesteng',
        danger: true,
      });
      if (!sure) return;
      if (await Admin.api('POST', `/api/senders/${senderId}/ban`, { banned: true }))
        Admin.toast(`${name} er utestengt.`);
      await loadPending();
    }

    // Guards the shortcut against a second decision landing on the same photo:
    // pending only refreshes after the round trip below, which is easily over a
    // second on an admin phone at one bar. Without this, five quick presses of
    // Enter - or one held key at the OS auto-repeat rate - sent five `approved`
    // writes against the same photo and left the next four untouched.
    let deciding = false;

    async function decide(id, status) {
      if (deciding) return;
      deciding = true;
      try {
        const response = await Admin.api('POST', `/api/images/${id}/status`, { status });
        // Admin.api already told the admin on failure. Leave `pending` untouched
        // so the photo stays visible and the next press retries it.
        if (!response) return;
        Admin.toast(status === 'approved' ? 'Godkjent – vises på skjermen.' : 'Avvist.');
        // Remove the decided item locally instead of re-fetching: the manifest
        // subscription (Admin.onManifest below) brings the authoritative list once
        // the write's generation bump reaches it.
        const index = pending.findIndex(image => image.id === id);
        pending = pending.filter(image => image.id !== id);
        currentId = pending[Math.min(index, pending.length - 1)]?.id ?? null;
        render();
      } finally {
        deciding = false;
      }
    }

    document.addEventListener('keydown', event => {
      // event.repeat is true for the synthetic keydown events an OS sends while a
      // key is held, at the auto-repeat rate - each one otherwise a full decide().
      if (event.repeat || pending.length === 0) return;

      // Enter is also how a focused button or link is activated, so a keyboard
      // press on "Logg ut" must not decide the photo instead; a dialog open for
      // the ban confirmation owns its own keys.
      const focused = document.activeElement;
      if (focused && focused.closest('button, a, input, select, textarea, dialog')) return;
      if (document.querySelector('dialog[open]')) return;

      if (event.key === 'Enter') decide(current().id, 'approved');
      if (event.key === 'Escape') decide(current().id, 'rejected');
    });

    Admin.onManifest(() => loadPending());
    loadPending();
  </script>
</body>
</html>
