<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kø</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <nav>
    <a href="/admin/queue">Kø<span class="badge"></span></a>
    <a href="/admin/images">Bilder</a>
    <a href="/upload">Last opp</a>
    <a href="/admin/settings">Innstillinger</a>
    <a href="/show">Skjerm</a>
    <form method="post" action="/logout" class="nav-logout"><button type="submit">Logg ut</button></form>
  </nav>

  <main>
    <div id="pairing-banner" hidden>
      <strong>Paringsmodus er på</strong>
      <span class="muted">Alle som sender melding til boten nå, blir registrert som avsender.</span>
    </div>
    <div id="takeover-banner" hidden></div>
    <p class="muted">Trykk <kbd>Enter</kbd> for å godkjenne eller <kbd>Esc</kbd> for å avvise det øverste bildet.</p>
    <div id="queue"></div>
  </main>

  <script src="/admin/admin.js"></script>
  <script>
    // The manifest carries only approved images, so the queue needs the pending
    // ones separately. /api/manifest reports the count; this page lists them.
    let pending = [];

    async function loadPending() {
      const response = await fetch('/api/images?status=pending', { cache: 'no-store' });
      if (!response.ok) return;
      pending = await response.json();
      render();
    }

    function render() {
      const container = document.getElementById('queue');
      if (pending.length === 0) {
        container.innerHTML = '<p class="empty">Ingenting på vent. Kos deg i festen.</p>';
        return;
      }
      container.innerHTML = pending.map(image => `
        <div class="queue-item" data-id="${image.id}">
          <img src="${Admin.imageUrl(image.id, 'display')}" alt="" loading="lazy">
          <div class="row">
            <strong>${Admin.escapeHtml(image.senderName ?? 'Ukjent')}</strong>
            <span class="muted">${Admin.escapeHtml(image.caption ?? '')}</span>
          </div>
          <div class="row">
            <button class="primary" onclick="decide('${image.id}','approved')">Godkjenn</button>
            <button class="danger" onclick="decide('${image.id}','rejected')">Avvis</button>
            ${image.senderId
              ? `<button class="danger" onclick="banSender(${image.senderId})">Utesteng avsender</button>`
              : ''}
          </div>
        </div>`).join('');
    }

    // Noticing a bad sender happens while looking at their photo, not while reading
    // the settings page. Only the numeric id goes into the attribute; the name is
    // attacker-controlled and stays in an escaped cell.
    async function banSender(senderId) {
      if (!confirm('Utesteng denne avsenderen? Alle bilder vedkommende allerede har sendt, blir '
                   + 'avvist, også de som ligger på skjermen nå. Dette kan ikke angres.')) return;
      await Admin.api('POST', `/api/senders/${senderId}/status`, { status: 'banned' });
      await loadPending();
    }

    // Guards the A/R shortcut against a second decision landing on the same photo:
    // pending only refreshes after the round trip below plus a full loadPending(),
    // which is easily over a second on an admin phone at one bar. Without this, five
    // quick taps of "A" - or one held key at the OS auto-repeat rate - sent five
    // `approved` writes against pending[0] and left photos 2-5 untouched, each write
    // still bumping the generation and forcing every connected client to refetch.
    let deciding = false;

    async function decide(id, status) {
      if (deciding) return;
      deciding = true;
      try {
        const response = await Admin.api('POST', `/api/images/${id}/status`, { status });
        // Admin.api already alerted the admin on failure. Leave `pending` untouched
        // on failure so the photo stays visible and the next shortcut press retries
        // it, rather than silently moving on to the next photo in the backlog.
        if (!response) return;
        // Remove the decided item locally instead of re-fetching: the manifest
        // subscription (Admin.onManifest below) already brings the authoritative
        // list once the write's generation bump reaches it, and the immediate
        // loadPending() this replaces was a second round trip for the same result.
        pending = pending.filter(image => image.id !== id);
        render();
      } finally {
        deciding = false;
      }
    }

    document.addEventListener('keydown', event => {
      // event.repeat is true for the synthetic keydown events an OS sends while a
      // key is held, at the auto-repeat rate - each one otherwise a full decide().
      if (event.repeat || pending.length === 0) return;

      // Enter is also how a focused button or link is activated, so without this a
      // keyboard press on "Logg ut" would decide the top photo instead of logging
      // out - and a mouse click on "Godkjenn" leaves that button focused, which
      // would make the next Enter fire both the shortcut and a second click. Queue
      // buttons vanish from the DOM as soon as their photo is decided, so focus
      // lands back on the body and the shortcuts come straight back; the nav and
      // the filter controls are exactly where suppressing them is wanted.
      const focused = document.activeElement;
      if (focused && focused.closest('button, a, input, select, textarea')) return;

      if (event.key === 'Enter') decide(pending[0].id, 'approved');
      if (event.key === 'Escape') decide(pending[0].id, 'rejected');
    });

    Admin.onManifest(() => loadPending());
    loadPending();
  </script>
</body>
</html>
