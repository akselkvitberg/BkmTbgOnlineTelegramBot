<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Settings</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <nav>
    <a href="/admin/queue">Queue<span class="badge"></span></a>
    <a href="/admin/images">Images</a>
    <a href="/admin/settings">Settings</a>
    <a href="/show">Screen</a>
    <form method="post" action="/logout" class="nav-logout"><button type="submit">Log out</button></form>
  </nav>

  <main>
    <div id="takeover-banner" hidden></div>

    <h2>Slideshow</h2>
    <label for="slideSeconds">Seconds per image</label>
    <input id="slideSeconds" type="number" min="2" max="120">
    <label for="transitionMs">Cross-fade (ms)</label>
    <input id="transitionMs" type="number" min="0" max="5000">
    <label for="order">Order</label>
    <select id="order">
      <option value="shuffle">Shuffle</option>
      <option value="newest-first">Newest first</option>
    </select>
    <label><input id="newestFirstBoost" type="checkbox"> Jump new photos to the front</label>
    <label for="recurringEvery">Show a pinned image every N photos</label>
    <input id="recurringEvery" type="number" min="1" max="100">
    <div class="row"><button class="primary" onclick="saveSlideshow()">Save</button></div>

    <h2>People</h2>
    <p class="muted">
      People appear here when they scan the QR on the screen. Review first means
      their photos wait in the queue; auto-approve sends them straight to the screen;
      banned drops them and rejects everything they have already sent.
    </p>
    <table id="senders"></table>
    <div class="row">
      <input id="newId" type="number" placeholder="Telegram id" style="width:auto">
      <button onclick="addSender()">Pre-approve a photographer</button>
    </div>
  </main>

  <script src="/admin/admin.js"></script>
  <script>
    let settings = null;
    let senders = [];

    const STATUSES = ['known', 'autoApprove', 'banned'];
    const LABELS = {
      known: 'Review first',
      autoApprove: 'Auto-approve',
      banned: 'Banned',
    };

    async function load() {
      const response = await fetch('/api/settings', { cache: 'no-store' });
      if (!response.ok) return;
      settings = await response.json();
      senders = settings.senders ?? [];

      // The manifest subscription below can call load() at any moment - e.g. another
      // admin approves a photo while this one is mid-keystroke in "Seconds per
      // image". A field currently focused is being edited right now; overwriting it
      // out from under the admin's cursor loses the keystroke and the value they were
      // typing, so every field that accepts typed input (not the checkboxes, which
      // have no in-progress-typing state to lose) is skipped while focused.
      for (const key of ['slideSeconds', 'transitionMs', 'recurringEvery']) {
        const input = document.getElementById(key);
        if (document.activeElement !== input) input.value = settings[key];
      }
      const orderEl = document.getElementById('order');
      if (document.activeElement !== orderEl) orderEl.value = settings.order;
      document.getElementById('newestFirstBoost').checked = settings.newestFirstBoost;
      renderSenders();
    }

    function renderSenders() {
      // Only the id - a number - goes into the onchange attribute. A sender's name
      // is attacker-controlled (a Telegram display name), so it is escaped into the
      // cell and never embedded in a JS argument, where HTML-escaping alone would
      // still leave a way to break out of the quoted string.
      document.getElementById('senders').innerHTML =
        senders.length === 0
          ? '<tr><td class="muted">Nobody yet. People appear here once they scan the QR.</td></tr>'
          : senders.map(sender => `
            <tr>
              <td>${Admin.escapeHtml(sender.name) || '<span class="muted">(no name)</span>'}</td>
              <td class="muted">${sender.id}</td>
              <td>
                <select onchange="setStatus(${sender.id}, this.value)">
                  ${STATUSES.map(value => `
                    <option value="${value}" ${sender.status === value ? 'selected' : ''}>
                      ${LABELS[value]}
                    </option>`).join('')}
                </select>
              </td>
            </tr>`).join('');
    }

    async function setStatus(id, status) {
      if (status === 'banned'
          && !confirm('Ban this person? Every photo they have already sent is rejected, '
                      + 'including any already on the screen. This cannot be undone.')) {
        renderSenders();   // put the dropdown back where it was
        return;
      }
      await Admin.api('POST', `/api/senders/${id}/status`, { status });
      await load();
    }

    async function addSender() {
      const input = document.getElementById('newId');
      const id = Number(input.value);
      if (!Number.isSafeInteger(id) || id <= 0) { alert('Enter a numeric Telegram id.'); return; }
      input.value = '';
      await Admin.api('POST', `/api/senders/${id}/status`, { status: 'autoApprove' });
      await load();
    }

    const saveSlideshow = () => Admin.api('PATCH', '/api/settings', {
      slideSeconds: Number(document.getElementById('slideSeconds').value),
      transitionMs: Number(document.getElementById('transitionMs').value),
      order: document.getElementById('order').value,
      newestFirstBoost: document.getElementById('newestFirstBoost').checked,
      recurringEvery: Number(document.getElementById('recurringEvery').value),
    }).then(load);

    // Without this, an admin watching this page during the event sees nothing happen
    // as people scan the QR and join - load() would only ever run once, at page open.
    // Admin.onManifest fires on every change that bumps the manifest generation, and
    // redeeming the join code does exactly that, so the signal is already there.
    Admin.onManifest(() => load());
    load();
  </script>
</body>
</html>
