<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilder</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <nav>
    <a href="/admin/queue">Kø<span class="badge"></span></a>
    <a href="/admin/images">Bilder</a>
    <a href="/upload">Last opp</a>
    <a href="/admin/telegram">Telegram</a>
    <a href="/admin/events">Arrangementer</a>
    <a href="/admin/settings">Innstillinger</a>
    <a href="/show">Skjerm</a>
    <form method="post" action="/logout" class="nav-logout"><button type="submit">Logg ut</button></form>
  </nav>

  <main>
    <div id="pairing-banner" hidden>
      <strong>Paringsmodus er på</strong>
      <span class="muted">Alle som sender melding til boten nå, blir registrert som avsender.</span>
    </div>
    <div id="takeover-banner" hidden></div>

    <header class="page-head">
      <h1>Bilder</h1>
      <div class="head-actions">
        <button class="quiet-danger" id="delete-all" hidden>Slett alle bilder</button>
        <a class="link-button" href="/upload">Last opp bilder</a>
      </div>
    </header>

    <div class="toolbar">
      <div class="segmented" id="filter" role="group" aria-label="Vis">
        <button data-status="approved" aria-pressed="true">På skjermen <span class="count"></span></button>
        <button data-status="hidden" aria-pressed="false">Skjult <span class="count"></span></button>
        <button data-status="pending" aria-pressed="false">Venter <span class="count"></span></button>
        <button data-status="rejected" aria-pressed="false">Avvist <span class="count"></span></button>
        <button data-status="" aria-pressed="false">Alle <span class="count"></span></button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </main>

  <script src="/admin/admin.js"></script>
  <script>
    'use strict';

    let status = 'approved';
    let all = [];

    const STATUS_LABELS = { approved: 'På skjermen', hidden: 'Skjult', pending: 'Venter', rejected: 'Avvist' };

    for (const button of document.querySelectorAll('#filter button')) {
      button.onclick = () => {
        status = button.dataset.status;
        for (const other of document.querySelectorAll('#filter button'))
          other.setAttribute('aria-pressed', String(other === button));
        render();
      };
    }

    // One fetch for every status, so each tab can show its count; the filter is
    // applied here rather than as a query per tab.
    async function load() {
      const ev = await Admin.currentEvent();
      if (!ev) return;
      const response = await fetch(`/api/images?event=${encodeURIComponent(ev.id)}`, { cache: 'no-store' });
      if (!response.ok) return;
      all = await response.json();
      document.querySelector('.page-head h1').textContent = `Bilder – ${ev.name}`;
      render();
    }

    document.getElementById('delete-all').onclick = removeAll;

    function render() {
      document.getElementById('delete-all').hidden = all.length === 0;

      for (const button of document.querySelectorAll('#filter button')) {
        const wanted = button.dataset.status;
        button.querySelector('.count').textContent =
          wanted ? all.filter(image => image.status === wanted).length : all.length;
      }

      const images = status ? all.filter(image => image.status === status) : all;
      const grid = document.getElementById('grid');
      if (images.length === 0) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1">
          <strong>Ingen bilder her</strong>
          ${status === 'approved' ? 'Godkjente bilder og bilder du laster opp selv, havner her.' : ''}
        </div>`;
        return;
      }

      // Only ids go into attributes; sender names and captions are
      // attacker-controlled and are escaped into text.
      grid.innerHTML = images.map(image => {
        const pinned = image.pin === 'recurring';
        const onScreen = image.status === 'approved';
        const canToggle = image.status === 'approved' || image.status === 'hidden';
        return `
        <figure data-id="${image.id}" class="${pinned ? 'pinned' : ''} ${image.status === 'hidden' ? 'hidden-photo' : ''}">
          <img src="${Admin.imageUrl(image.id, 'thumb')}" alt="" loading="lazy">
          <div class="flags">
            ${pinned ? '<span class="flag pin" title="Vises på nytt med noen bilders mellomrom">Festet</span>' : ''}
            ${!status ? `<span class="flag">${STATUS_LABELS[image.status] ?? image.status}</span>` : ''}
          </div>
          <figcaption>
            <span>${Admin.escapeHtml(image.senderName ?? 'Lastet opp av arrangør')}</span>
            <span class="muted">${image.caption ? Admin.escapeHtml(image.caption) : Admin.timeAgo(image.receivedAt)}</span>
          </figcaption>
          <div class="actions">
            ${canToggle ? `<button class="small" data-act="toggle">${onScreen ? 'Skjul' : 'Vis'}</button>` : ''}
            ${image.status === 'pending'
              ? '<button class="small" data-act="approve">Godkjenn</button>' : ''}
            ${onScreen ? `<button class="small" data-act="pin">${pinned ? 'Løsne' : 'Fest'}</button>` : ''}
            ${onScreen ? '<button class="small" data-act="takeover">Ta over</button>' : ''}
            <button class="small quiet-danger" data-act="delete">Slett</button>
          </div>
        </figure>`;
      }).join('');

      for (const figure of grid.querySelectorAll('figure')) {
        const image = images.find(i => i.id === figure.dataset.id);
        for (const button of figure.querySelectorAll('[data-act]'))
          button.onclick = () => ACTIONS[button.dataset.act](image);
      }
    }

    const ACTIONS = {
      toggle: image => image.status === 'hidden'
        ? setStatus(image.id, 'approved', 'Vises på skjermen igjen.')
        : setStatus(image.id, 'hidden', 'Skjult fra skjermen.'),
      approve: image => setStatus(image.id, 'approved', 'Godkjent – vises på skjermen.'),
      pin: async image => {
        const pin = image.pin === 'recurring' ? 'none' : 'recurring';
        if (await Admin.api('POST', `/api/images/${image.id}/pin`, { pin }))
          Admin.toast(pin === 'recurring' ? 'Festet – vises på nytt med jevne mellomrom.' : 'Løsnet.');
        load();
      },
      takeover,
      delete: remove,
    };

    async function setStatus(id, next, message) {
      if (await Admin.api('POST', `/api/images/${id}/status`, { status: next })) Admin.toast(message);
      load();
    }

    async function remove(image) {
      const sure = await Admin.confirm({
        title: 'Slette bildet?',
        body: 'Det fjernes fra skjermen og fra lagringen. Dette kan ikke angres.',
        confirmLabel: 'Slett',
        danger: true,
      });
      if (!sure) return;
      if (await Admin.api('DELETE', `/api/images/${image.id}`)) Admin.toast('Slettet.');
      load();
    }

    async function removeAll() {
      const ev = await Admin.currentEvent();
      const count = all.length;
      const sure = await Admin.confirm({
        title: count === 1 ? 'Slette det ene bildet?' : `Slette alle ${count} bildene?`,
        body: `Alle bilder i ${ev.name} fjernes fra skjermen og fra lagringen, også de som venter, er skjult eller avvist. Dette kan ikke angres.`,
        confirmLabel: 'Slett alle',
        danger: true,
      });
      if (!sure) return;
      const response = await Admin.api('DELETE', `/api/images?event=${encodeURIComponent(ev.id)}`);
      if (response) {
        const { deleted } = await response.json().catch(() => ({ deleted: count }));
        Admin.toast(deleted === 1 ? 'Slettet 1 bilde.' : `Slettet ${deleted} bilder.`);
      }
      load();
    }

    async function takeover(image) {
      // Fixed choices rather than a free-text prompt: a typo (600 for 60) is the
      // mistake the takeover banner otherwise has to catch after the fact.
      const minutes = await Admin.dialog({
        title: 'Vis bare dette bildet',
        body: 'Skjermen holder bildet til tiden er ute, eller til du avslutter fra banneret øverst.',
        actions: [
          { label: 'Avbryt', value: null },
          { label: '5 min', value: 5 },
          { label: '15 min', value: 15 },
          { label: '60 min', value: 60 },
          { label: 'Til jeg avslutter', value: 0, kind: 'accent' },
        ],
      });
      if (minutes === null) return;
      if (await Admin.api('PUT', '/api/takeover', { imageId: image.id, minutes: minutes || null }))
        Admin.toast('Bildet holder skjermen nå.');
      load();
    }

    Admin.onManifest(() => load());
    load();
  </script>
</body>
</html>
