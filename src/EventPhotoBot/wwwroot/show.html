<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bilder fra arrangementet</title>
  <link rel="stylesheet" href="/show.css">
</head>
<body>
  <!-- Filled by show.js. The stage's contents are the layout - two cross-fading
       slides for one-photo-at-a-time, a grid of tiles for the mosaic, and so on -
       and the layout is a setting an organiser can change mid-event, so the markup
       cannot be written here. -->
  <div id="stage"></div>

  <!-- The caption bar belongs to the one-photo-at-a-time layout alone. The denser
       layouts either carry a caption per photo (polaroid, split) or none at all:
       one bar across the bottom of a six-tile mosaic says nothing about which tile
       it means. -->
  <div id="caption" hidden>
    <span id="caption-sender"></span>
    <span id="caption-text"></span>
  </div>

  <!-- Two holding cards, one shown at a time. The inviting one asks the room for
       photos; the quiet one is for a screen that must not ask (see showJoinInvite
       in Settings), where the heading would be an invitation in its own right. -->
  <div id="empty">
    <p id="empty-event-name" hidden></p>
    <div id="empty-invite">
      <h1>Send oss bildene dine</h1>
      <p id="empty-detail">De dukker opp her så snart en arrangør har godkjent dem.</p>
      <div id="join" hidden>
        <img id="join-qr" alt="Skann for å sende bilder">
        <p id="join-handle"></p>
      </div>
    </div>
    <div id="empty-quiet" hidden>
      <h1>Bildene kommer snart</h1>
    </div>
  </div>

  <!-- The event's name, small in a corner while photos are showing. After #empty
       on purpose: show.css hides it while the holding card is up, which already
       carries the name in large type. -->
  <div id="event-tag" hidden></div>

  <div id="offline" hidden>Kobler til igjen&hellip;</div>

  <!-- Local (not server) controls for whoever is minding the projector: hide/show
       the caption overlay, and go fullscreen without hunting for F11. Shown
       briefly on load so the shortcuts are discoverable, then hidden by show.js. -->
  <div id="caption-hint">
    Trykk <strong>F</strong> for fullskjerm &middot; <strong>C</strong> for å vise/skjule bildetekst
  </div>

  <!-- Small corner QR while photos are showing, so somebody arriving late can still
       join without waiting for the screen to run out of pictures. -->
  <img id="join-badge" hidden alt="Skann for å sende bilder">

  <!-- Keeps the display machine awake where the Wake Lock API is unavailable. -->
  <video id="keepawake" muted loop playsinline src="/keepawake.mp4"></video>

  <script src="/show.js"></script>
</body>
</html>
